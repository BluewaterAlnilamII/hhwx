name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  auth-database:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start disposable database and apply migrations
        run: npx --no-install supabase db start

      - name: Test account and chat database permissions and behavior
        run: npx --no-install supabase test db supabase/tests/auth_registration.sql supabase/tests/account_email_change.sql supabase/tests/auto_game_profile_ownership.sql supabase/tests/realtime_message_board.sql supabase/tests/chat_images.sql supabase/tests/chat_stamps.sql supabase/tests/chat_rooms.sql supabase/tests/chat_reading.sql supabase/tests/chat_activity.sql

      - name: Stop disposable database
        if: always()
        run: npx --no-install supabase stop --no-backup

  medley-foundation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install locked Rust toolchain
        run: rustup show active-toolchain

      - name: Check Rust formatting
        run: npm run format:medley-foundation

      - name: Lint Rust workspace
        run: npm run lint:medley-foundation

      - name: Test Rust workspace
        run: npm run test:medley-foundation

      - name: Check Rust workspace for WASM
        run: npm run check:medley-foundation:wasm

  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test CSP policy and reporting
        run: npm run test:csp

      - name: Test account authentication
        run: npm run test:auth

      - name: Test chat messages and images
        run: npm run test:chat

      - name: Test Bandori chart simulator
        run: npm run test:bandori-chart-simulator

      - name: Test medley foundation source boundary
        run: npm run test:medley-foundation:source

      - name: Test committed medley WebAssembly binding
        run: npm run test:medley-foundation:binding

      - name: Test single-song shared foundation
        run: npm run test:team-builder

      - name: Test cache contracts
        run: npm run test:cache

      - name: Test Bandori player queries
        run: npm run test:bandori-player

      - name: Test service status
        run: npm run test:service-status

      - name: Test user game profile sync
        run: node --import tsx --test tests/user-game-profile-sync.test.mjs

      - name: Test Bandori cards
        run: npm run test:bandori-cards

      - name: Test shared Bandori help popovers
        run: node --import tsx --test tests/bandori-help-popover.test.mjs

      - name: Test Costumes API
        run: npm run test:bandori-costumes

      - name: Test OurNotes master API
        run: npm run test:ournotes-master

      - name: Test OurNotes tracker API
        run: npm run test:ournotes-tracker

      - name: Test Bandori TOP10 tracker
        run: npm run test:bandori-tracker-topdata

      - name: Test Bandori cutoff history
        run: npm run test:bandori-tracker-history

      - name: Test Bandori public asset and R2 source contracts
        run: npm run test:bandori-public-assets

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: example_publishable_key
          SUPABASE_SECRET_KEY: example_secret_key
          NEXT_PUBLIC_SITE_ASSET_CDN_BASE_URL: https://your-site-asset-cdn.example.com
          NEXT_PUBLIC_BANDORI_ASSET_CDN_BASE_URL: https://your-bandori-asset-cdn.example.com
