name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  medley-foundation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install locked Rust toolchain
        run: rustup show active-toolchain

      - name: Check Rust formatting
        run: npm run format:medley-foundation

      - name: Lint Rust workspace
        run: npm run lint:medley-foundation

      - name: Test Rust workspace
        run: npm run test:medley-foundation

      - name: Check Rust workspace for WASM
        run: npm run check:medley-foundation:wasm

  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test medley foundation source boundary
        run: npm run test:medley-foundation:source

      - name: Test cache contracts
        run: npm run test:cache

      - name: Test Bandori cards
        run: npm run test:bandori-cards

      - name: Test Bandori TOP10 tracker
        run: npm run test:bandori-tracker-topdata

      - name: Test Bandori cutoff history
        run: npm run test:bandori-tracker-history

      - name: Test Bandori public asset and R2 source contracts
        run: npm run test:bandori-public-assets

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: example_publishable_key
          SUPABASE_SECRET_KEY: example_secret_key
          NEXT_PUBLIC_SITE_ASSET_CDN_BASE_URL: https://your-site-asset-cdn.example.com
          NEXT_PUBLIC_BANDORI_ASSET_CDN_BASE_URL: https://your-bandori-asset-cdn.example.com
